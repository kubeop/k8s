---
- name: Etcd | Create etcd group
  ansible.builtin.group:
    name: etcd
    gid: 201
    system: true
  tags:
    - create_etcd_group
    - install_etcd

- name: Etcd | Create etcd user
  ansible.builtin.user:
    name: etcd
    uid: 201
    group: etcd
    comment: "Etcd User"
    create_home: false
    home: "{{ etcd.data_dir }}"
    shell: /sbin/nologin
    system: true
  tags:
    - create_etcd_user
    - install_etcd

- name: Etcd | Unarchive etcd
  ansible.builtin.unarchive:
    src: "{{ download.dest }}/etcd/{{ etcd.version }}/etcd-{{ etcd.version }}-linux-{%- if ansible_architecture == 'x86_64' -%}amd64{%- else -%}arm64{%- endif -%}.tar.gz"
    dest: /tmp/
    remote_src: no
    extra_opts:
    - --strip-components=1
    exclude:
    - "README*"
    - "Documentation"
  tags: install_etcd

- name: Etcd | Install etcd
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/bin/"
    owner: root
    group: root
    mode: 0755
    remote_src: yes
  with_items:
    - {src: "/tmp/etcd"}
    - {src: "/tmp/etcdctl"}
    - {src: "/tmp/etcdutl"}
  tags: install_etcd
  notify:
    - restart etcd

- name: Etcd | Distribution etcd certificates
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/etcd/pki/"
    owner: root
    group: root
    mode: 0644
  with_items:
    - "{{ certificates.dir }}/etcd-ca.pem"
    - "{{ certificates.dir }}/{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}/etcd-server.pem"
    - "{{ certificates.dir }}/{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}/etcd-server.key"
    - "{{ certificates.dir }}/{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}/etcd-peer.pem"
    - "{{ certificates.dir }}/{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}/etcd-peer.key"
    - "{{ certificates.dir }}/{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}/etcd-healthcheck-client.pem"
    - "{{ certificates.dir }}/{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}/etcd-healthcheck-client.key"
  tags:
    - dis_etcd_certs
    - dis_certs

- name: Etcd | Check if etcd data directory has existing member
  ansible.builtin.stat:
    path: "{{ etcd.data_dir }}/member"
    get_attributes: false
    get_checksum: false
    get_mime: false
  register: etcd_data_dir_member
  tags:
    - dis_etcd_config
    - etcd_scale

- name: Etcd | Set etcd node name
  ansible.builtin.set_fact:
    etcd_node_name: "{{ ansible_hostname.split('-')[-2:] | join('-') | lower }}"
  tags:
    - dis_etcd_config
    - etcd_scale

# 扩容时新节点需追加到 inventory [etcd] 组末尾，确保 groups['etcd'][0] 仍为已存在的健康节点
- name: Etcd | Probe existing cluster health (skip on first bootstrap)
  ansible.builtin.command: >-
    etcdctl endpoint health
    --endpoints=https://{{ groups['etcd'][0] }}:2379
    --cacert=/etc/etcd/pki/etcd-ca.pem
    --cert=/etc/etcd/pki/etcd-healthcheck-client.pem
    --key=/etc/etcd/pki/etcd-healthcheck-client.key
  delegate_to: "{{ groups['etcd'][0] }}"
  register: etcd_cluster_health
  changed_when: false
  failed_when: false
  when: not etcd_data_dir_member.stat.exists
  tags:
    - dis_etcd_config
    - etcd_scale

- name: Etcd | Set initial-cluster-state
  ansible.builtin.set_fact:
    etcd_initial_cluster_state: >-
      {{ 'existing' if (etcd_data_dir_member.stat.exists or (etcd_cluster_health.rc | default(1)) == 0) else 'new' }}
  tags:
    - dis_etcd_config
    - etcd_scale

- name: Etcd | List existing members (scale-out only)
  ansible.builtin.command: >-
    etcdctl member list -w json
    --endpoints=https://{{ groups['etcd'][0] }}:2379
    --cacert=/etc/etcd/pki/etcd-ca.pem
    --cert=/etc/etcd/pki/etcd-healthcheck-client.pem
    --key=/etc/etcd/pki/etcd-healthcheck-client.key
  delegate_to: "{{ groups['etcd'][0] }}"
  register: etcd_member_list
  changed_when: false
  failed_when: false
  when:
    - not etcd_data_dir_member.stat.exists
    - (etcd_cluster_health.rc | default(1)) == 0
  tags:
    - dis_etcd_config
    - etcd_scale

- name: Etcd | Add new member to existing cluster (idempotent)
  ansible.builtin.command: >-
    etcdctl member add {{ etcd_node_name }}
    --peer-urls=https://{%- if kubernetes.ipv4_stack -%}{{ ansible_default_ipv4.address }}{%- else -%}[{{ ansible_default_ipv6.address }}]{%- endif -%}:2380
    --endpoints=https://{{ groups['etcd'][0] }}:2379
    --cacert=/etc/etcd/pki/etcd-ca.pem
    --cert=/etc/etcd/pki/etcd-healthcheck-client.pem
    --key=/etc/etcd/pki/etcd-healthcheck-client.key
  delegate_to: "{{ groups['etcd'][0] }}"
  register: etcd_member_add
  changed_when: "'Added member' in (etcd_member_add.stdout | default(''))"
  failed_when:
    - etcd_member_add.rc != 0
    - "'already added' not in (etcd_member_add.stderr | default(''))"
  when:
    - not etcd_data_dir_member.stat.exists
    - (etcd_cluster_health.rc | default(1)) == 0
    - etcd_node_name not in (etcd_member_list.stdout | default(''))
  tags:
    - dis_etcd_config
    - etcd_scale

- name: Etcd | Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd.data_dir }}"
    owner: etcd
    group: etcd
    mode: 0700
    state: directory
  tags:
    - create_etcd_data_dir
  notify:
    - restart etcd

- name: Etcd | Generate etcd configure
  ansible.builtin.template:
    src: "etcd.conf.j2"
    dest: "/etc/etcd/etcd.conf"
  tags: dis_etcd_config
  notify:
    - restart etcd

- name: Etcd | Generate etcd systemd unit
  ansible.builtin.template:
    src: "etcd.service.j2"
    dest: "/usr/lib/systemd/system/etcd.service"
  tags: dis_etcd_config
  notify:
    - restart etcd
